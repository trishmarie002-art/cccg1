  <!-- Review Text -->
  <g>
    <text x="36" y="148" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#2d3748">They did an absolutely fantastic job on our new metal roof. We can't</text>
    <text x="36" y="174" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#2d3748">say enough good things about their service. They kept us well</text>
    <text x="36" y="200" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#2d3748">informed during the permitting process and during the tear-off/new</text>
    <text x="36" y="226" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#2d3748">install of the roof. Very courteous workers and cleaned up the job</text>
    <text x="36" y="252" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#2d3748">site daily. We love our new metal and highly recommend them!</text>
  </g>

